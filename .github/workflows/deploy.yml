name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Optional: a Contentful webhook can trigger a rebuild after publishing,
  # so the prerendered snapshot stays fresh (the app refetches content anyway).
  repository_dispatch:
    types: [contentful-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Provides the public address of the site (https://<owner>.github.io/<repo>).
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Accepted from either Variables or Secrets, whichever tab they were added to.
          VITE_CONTENTFUL_SPACE_ID: ${{ vars.VITE_CONTENTFUL_SPACE_ID || secrets.VITE_CONTENTFUL_SPACE_ID }}
          VITE_CONTENTFUL_ENVIRONMENT: ${{ vars.VITE_CONTENTFUL_ENVIRONMENT || 'master' }}
          VITE_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.VITE_CONTENTFUL_ACCESS_TOKEN || vars.VITE_CONTENTFUL_ACCESS_TOKEN }}
      # Without Contentful the page would ship with empty image placeholders; fail loudly instead.
      - name: Check that the content snapshot was embedded
        run: |
          if ! grep -q 'id="contentful-snapshot"' dist/index.html; then
            echo "::error::No Contentful content in the build. Add the VITE_CONTENTFUL_SPACE_ID variable and the VITE_CONTENTFUL_ACCESS_TOKEN secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
